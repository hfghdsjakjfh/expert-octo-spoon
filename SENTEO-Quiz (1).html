<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENTEO — Quiz Mélanges</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#1b2435;--muted:#aab5c8;--accent:#8bb7ff;--good:#35c98b;--bad:#ff7777}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(ellipse at top,#202d49,#101522 65%);color:#f5f7fb;font:16px/1.5 system-ui,Segoe UI,Arial;min-height:100vh}
main{min-height:100vh;max-width:1100px;margin:auto;padding:clamp(18px,4vw,48px);display:flex;flex-direction:column;justify-content:center}
header{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:24px}h1{font-size:clamp(25px,4vw,38px);margin:0}.sub{color:var(--muted);margin:4px 0 0}.pill{background:#29364d;border:1px solid #3b4c68;border-radius:99px;padding:8px 14px;color:#dce8ff}
.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid #35435a;border-radius:24px;padding:clamp(20px,4vw,38px);box-shadow:0 24px 70px #0005}
.progress{height:9px;background:#303b50;border-radius:20px;overflow:hidden;margin:0 0 26px}.bar{height:100%;width:0;background:var(--accent);transition:width .25s}
.topline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);gap:12px;flex-wrap:wrap}.qnum{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#b8c9e8}
h2{font-size:clamp(22px,3.2vw,32px);line-height:1.2;margin:12px 0 8px}.hint{color:var(--muted);margin:0 0 24px}
.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.choice{background:#26334a;color:#f6f8fc;border:1px solid #455570;border-radius:16px;padding:18px 10px;font-size:20px;font-weight:700;cursor:pointer;transition:.15s}.choice:hover:not(:disabled){background:#344663;transform:translateY(-2px)}.choice:disabled{cursor:default;opacity:.8}.choice.correct{background:#124b3b;border-color:var(--good)}.choice.wrong{background:#552d37;border-color:var(--bad)}
.feedback{margin-top:22px;padding:16px 18px;border-radius:14px;background:#26334a;display:none}.feedback.show{display:block}.feedback.good{border:1px solid var(--good)}.feedback.bad{border:1px solid var(--bad)}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap}button.nav{border:0;border-radius:13px;padding:13px 20px;font-weight:700;font-size:15px;cursor:pointer;background:#34445f;color:white}button.nav.primary{background:#8bb7ff;color:#101522}button:disabled{opacity:.35;cursor:not-allowed}.score{color:var(--muted);font-size:14px}
select{background:#26334a;color:white;border:1px solid #455570;border-radius:10px;padding:9px 12px;font:inherit} .finish{text-align:center;display:none}.finish h2{font-size:clamp(30px,5vw,48px)}.finish p{color:var(--muted)}
@media(max-width:600px){.choices{grid-template-columns:repeat(5,1fr);gap:7px}.choice{padding:14px 4px}.panel{border-radius:18px}}
</style></head>
<body><main>
<header><div><h1>SENTEO — Mélanges</h1><p class="sub">Quiz de révision · 65 questions</p></div><div class="pill" id="score">Résultat : 0 / 65</div></header>
<section class="panel" id="quiz"><div class="progress"><div class="bar" id="bar"></div></div><div class="topline"><span class="qnum" id="number">Question 1 sur 65</span><label>Aller à : <select id="jump" aria-label="Choisir une question"></select></label></div><h2 id="prompt">Lis la question 1 dans ton document SENTEO, puis choisis ta réponse.</h2><p class="hint">Garde le document « SENTEO – Mélanges » ouvert dans un autre onglet pour lire l’énoncé et les choix.</p><div class="choices" id="choices"></div><div class="feedback" id="feedback" role="status"></div><div class="controls"><button class="nav" id="prev">← Précédent</button><span class="score" id="progressText">0 réponse sur 65</span><button class="nav primary" id="next">Suivant →</button></div></section>
<section class="panel finish" id="finish"><h2>Quiz terminé !</h2><p id="finalScore"></p><button class="nav primary" id="restart">Recommencer</button></section>
</main>
<script>
const key=['A','B','C','D','C','D','B','C','B','D','D','B','E','D','B','A','D','E','A','B','A','D','D','A','D','C','D','C','B','A','D','C','A','C','A','D','C','A','B','A','D','B','C','D','B','B','D','B','A','D','C','C','C','B','B','D','B','B','D','D','D','A','C','D','D'];
let current=0;const answers={};
const $=id=>document.getElementById(id);
for(let i=1;i<=65;i++){let o=document.createElement('option');o.value=i-1;o.textContent='Question '+i;$('jump').append(o)}
function render(){const n=current+1;$('number').textContent=`Question ${n} sur 65`;$('prompt').textContent=`Lis la question ${n} dans ton document SENTEO, puis choisis ta réponse.`;$('jump').value=current;$('bar').style.width=(Object.keys(answers).length/65*100)+'%';$('score').textContent=`Résultat : ${Object.keys(answers).filter(k=>answers[k]===key[+k]).length} / 65`;$('progressText').textContent=`${Object.keys(answers).length} réponse${Object.keys(answers).length>1?'s':''} sur 65`;$('prev').disabled=current===0;$('next').textContent=current===64?'Terminer':'Suivant →';$('choices').innerHTML='';['A','B','C','D','E'].forEach(letter=>{let b=document.createElement('button');b.className='choice';b.textContent=letter;b.disabled=answers[current]!==undefined;if(answers[current]!==undefined){if(letter===key[current])b.classList.add('correct');if(letter===answers[current]&&letter!==key[current])b.classList.add('wrong')}b.onclick=()=>{answers[current]=letter;render()};$('choices').append(b)});let f=$('feedback');f.className='feedback';if(answers[current]!==undefined){let ok=answers[current]===key[current];f.classList.add('show',ok?'good':'bad');f.innerHTML=ok?'<strong>Bonne réponse !</strong>':'<strong>Pas tout à fait.</strong> La bonne réponse est <strong>'+key[current]+'</strong>.'} }
$('jump').onchange=e=>{current=+e.target.value;render()};$('prev').onclick=()=>{current--;render()};$('next').onclick=()=>{if(current<64){current++;render()}else if(Object.keys(answers).length===65){$('quiz').style.display='none';$('finish').style.display='block';let correct=key.filter((a,i)=>answers[i]===a).length;$('finalScore').textContent=`Tu as obtenu ${correct} bonnes réponses sur 65.`}else{let missing=key.findIndex((a,i)=>answers[i]===undefined);current=missing;render()}};$('restart').onclick=()=>{for(let k in answers)delete answers[k];current=0;$('finish').style.display='none';$('quiz').style.display='block';render()};render();
</script></body></html>
